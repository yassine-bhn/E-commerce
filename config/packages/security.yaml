security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_USER]

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory: { memory: null }
        customer_provider:
            id: App\Identity\Infrastructure\Security\CustomerProfileUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: customer_provider
            entry_point: App\Identity\Infrastructure\Security\LoginAuthenticator
            access_denied_handler: App\Identity\Infrastructure\Security\JsonAccessDeniedHandler
            custom_authenticators:
                - App\Identity\Infrastructure\Security\LoginAuthenticator
            # "Remember me" (spec-run-7/spec.md, R3/R4/R10; docs/adr/ADR-0011): a ticked login
            # issues a persistent cookie so the storefront is still signed in after the browser
            # restarts. The secret is the app secret, so the credential is invalidated
            # whenever the app secret or the customer password changes.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: '%env(int:REMEMBER_ME_LIFETIME)%'
                # Shared with MalformedRememberMeCookieSubscriber through one parameter, so the
                # guard can never watch a different cookie than the firewall writes.
                name: '%remember_me_cookie_name%'
                path: /
                httponly: true
                # Mirrors framework.session cookie flags: plain HTTP locally, and
                # SameSite=None + Secure in production where the storefront is a
                # separate origin (see deploy/Caddyfile).
                samesite: lax
                secure: false
            logout:
                path: identity_logout

    # Note: Only the *first* matching rule is applied
    access_control:
        # Kubernetes/Docker probes must never be challenged (WP3, R25).
        - { path: ^/healthz$, roles: PUBLIC_ACCESS }
        - { path: ^/readyz$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/google, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/admin, roles: ROLE_ADMIN }
        - { path: ^/api/v1/storefront/customer, roles: ROLE_USER }
        - { path: ^/api/v1/storefront/wishlist, roles: ROLE_USER }
        - { path: ^/api/v1/storefront/orders/track, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/storefront/orders, methods: [GET, POST], roles: ROLE_USER }
        - { path: ^/api/v1/storefront/quote-requests$, methods: [GET], roles: ROLE_USER }
        - { path: ^/api/v1/storefront/quote-requests$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/storefront/cart/quote, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/storefront/cart, roles: ROLE_USER }
        - { path: ^/api/v1/storefront, roles: PUBLIC_ACCESS }

when@prod:
    security:
        firewalls:
            main:
                # The storefront lives on STOREFRONT_DOMAIN while the API answers on
                # APP_DOMAIN (deploy/Caddyfile), so the cookie crosses sites: same
                # policy as framework.session.cookie_* in the production block there.
                remember_me:
                    samesite: none
                    secure: true

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
