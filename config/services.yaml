# DIP-001 / LAY-003 — Domain is not a service layer; HTTP under */Infrastructure/Http (SRP-002).
parameters:
    # The remember-me cookie name, shared by the firewall (config/packages/security.yaml) and the
    # request-input guard that drops malformed payloads before the firewall reads it, so both always
    # address the same cookie.
    remember_me_cookie_name: 'REMEMBERME'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Shared\Application\Port\HealthProbe:
            tags: ['app.health_probe']
        App\Shared\Application\Projection\ProjectionReplayer:
            tags: ['app.projection_replayer']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Domain/**'
            - '../src/**/Application/Command/**'
            - '../src/**/Application/Query/**'
            - '../src/Identity/Infrastructure/Security/CustomerUser.php'

    App\Shared\Infrastructure\:
        resource: '../src/Shared/Infrastructure/'

    App\Catalog\Infrastructure\:
        resource: '../src/Catalog/Infrastructure/'
    App\Cart\Infrastructure\:
        resource: '../src/Cart/Infrastructure/'
    App\Ordering\Infrastructure\:
        resource: '../src/Ordering/Infrastructure/'
    App\Payment\Infrastructure\:
        resource: '../src/Payment/Infrastructure/'
    App\Inventory\Infrastructure\:
        resource: '../src/Inventory/Infrastructure/'
    App\Shipping\Infrastructure\:
        resource: '../src/Shipping/Infrastructure/'
    App\Identity\Infrastructure\:
        resource: '../src/Identity/Infrastructure/'
        exclude:
            - '../src/Identity/Infrastructure/Security/CustomerUser.php'
    App\Promotions\Infrastructure\:
        resource: '../src/Promotions/Infrastructure/'

    App\Shared\Application\:
        resource: '../src/Shared/Application/'
        exclude:
            - '../src/Shared/Application/Command/**'
            - '../src/Shared/Application/Query/**'

    App\Catalog\Application\:
        resource: '../src/Catalog/Application/'
        exclude:
            - '../src/Catalog/Application/Command/**'
            - '../src/Catalog/Application/Query/**'
    App\Cart\Application\:
        resource: '../src/Cart/Application/'
        exclude:
            - '../src/Cart/Application/Command/**'
            - '../src/Cart/Application/Query/**'
    App\Ordering\Application\:
        resource: '../src/Ordering/Application/'
        exclude:
            - '../src/Ordering/Application/Command/**'
            - '../src/Ordering/Application/Query/**'
    App\Payment\Application\:
        resource: '../src/Payment/Application/'
        exclude:
            - '../src/Payment/Application/Command/**'
            - '../src/Payment/Application/Query/**'
    App\Inventory\Application\:
        resource: '../src/Inventory/Application/'
        exclude:
            - '../src/Inventory/Application/Command/**'
            - '../src/Inventory/Application/Query/**'
    App\Shipping\Application\:
        resource: '../src/Shipping/Application/'
        exclude:
            - '../src/Shipping/Application/Command/**'
            - '../src/Shipping/Application/Query/**'
    App\Identity\Application\:
        resource: '../src/Identity/Application/'
        exclude:
            - '../src/Identity/Application/Command/**'
            - '../src/Identity/Application/Query/**'
    App\Promotions\Application\:
        resource: '../src/Promotions/Application/'
        exclude:
            - '../src/Promotions/Application/Command/**'
            - '../src/Promotions/Application/Query/**'

    App\Catalog\Domain\Repository\ProductRepository:
        alias: App\Catalog\Infrastructure\Persistence\DoctrineProductRepository

    App\Cart\Domain\Repository\CartRepository:
        alias: App\Cart\Infrastructure\Persistence\DbalCartRepository

    App\Ordering\Domain\Repository\OrderRepository:
        alias: App\Ordering\Infrastructure\Persistence\DoctrineOrderRepository

    # solid Task 2.7 (ISP-003): the placement port claims the idempotency key and saves the order
    # behind one adapter, keeping PlaceOrderHandler at five dependencies.
    App\Ordering\Application\Port\OrderPlacementStore:
        alias: App\Ordering\Infrastructure\Persistence\DbalOrderPlacementStore

    # solid Task 3.1 (DIP-003): the Identity handlers read and write through narrow ports; the
    # adapters are the only DBAL holders left in the context. One alias per port, all over the
    # adapter that owns the table.
    App\Shared\Application\Port\ProductExistencePort:
        alias: App\Catalog\Infrastructure\ReadModel\StorefrontProductRepository

    # solid Task 3.2 (DIP-003): the category, product and banner handlers read and write through
    # narrow ports; one adapter per table owns the SQL.
    App\Shared\Application\Port\ProductSearchIndexPort:
        alias: App\Catalog\Infrastructure\Search\StorefrontProductSearchIndexer

    App\Catalog\Application\Port\CategoryReader:
        alias: App\Catalog\Infrastructure\Persistence\DbalCategoryStore

    App\Catalog\Application\Port\CategoryCreator:
        alias: App\Catalog\Infrastructure\Persistence\DbalCategoryStore

    App\Catalog\Application\Port\CategoryTreeWriter:
        alias: App\Catalog\Infrastructure\Persistence\DbalCategoryStore

    App\Catalog\Application\Port\CategoryVisibilityWriter:
        alias: App\Catalog\Infrastructure\Persistence\DbalCategoryStore

    App\Catalog\Application\Port\CategoryDeletionReader:
        alias: App\Catalog\Infrastructure\Persistence\DbalCategoryStore

    App\Catalog\Application\Port\CategoryDeleter:
        alias: App\Catalog\Infrastructure\Persistence\DbalCategoryStore

    App\Catalog\Application\Port\CategoryHierarchyReader:
        alias: App\Catalog\Infrastructure\Persistence\DbalCategoryStore

    App\Catalog\Application\Port\ProductPublicationStore:
        alias: App\Catalog\Infrastructure\Persistence\DbalAdminProductStore

    App\Catalog\Application\Port\ProductReviewStore:
        alias: App\Catalog\Infrastructure\Persistence\DbalAdminProductStore

    App\Catalog\Application\Port\ProductDeletionReader:
        alias: App\Catalog\Infrastructure\Persistence\DbalAdminProductStore

    App\Catalog\Application\Port\AdminProductWriter:
        alias: App\Catalog\Infrastructure\Persistence\DbalAdminProductStore

    App\Catalog\Application\Port\BannerSetReader:
        alias: App\Catalog\Infrastructure\Persistence\DbalBannerStore

    App\Catalog\Application\Port\BannerImageStore:
        alias: App\Catalog\Infrastructure\Persistence\DbalBannerStore

    # solid Task 4.9 (SRP-002): the brand commands read and write through the brand ports; the
    # adapter owns the whole rename workflow (access policy, submission follow-up, audit).
    App\Catalog\Application\Port\BrandReader:
        alias: App\Catalog\Infrastructure\Persistence\DbalBrandStore

    App\Catalog\Application\Port\BrandStore:
        alias: App\Catalog\Infrastructure\Persistence\DbalBrandStore

    # solid Task 4.10 (SRP-002): the promo-code commands read and write through the ports.
    App\Promotions\Application\Port\PromoCodeReader:
        alias: App\Promotions\Infrastructure\Persistence\DbalPromoCodeStore

    App\Promotions\Application\Port\PromoCodeStore:
        alias: App\Promotions\Infrastructure\Persistence\DbalPromoCodeStore

    App\Identity\Application\Port\CustomerAccountReader:
        alias: App\Identity\Infrastructure\Persistence\DbalCustomerAccountAdapter

    App\Identity\Application\Port\CustomerDeletionReader:
        alias: App\Identity\Infrastructure\Persistence\DbalCustomerAccountAdapter

    App\Identity\Application\Port\CustomerStatusStore:
        alias: App\Identity\Infrastructure\Persistence\DbalCustomerAccountAdapter

    App\Identity\Application\Port\CustomerRoleStore:
        alias: App\Identity\Infrastructure\Persistence\DbalCustomerAccountAdapter

    App\Identity\Application\Port\CustomerDeletionWriter:
        alias: App\Identity\Infrastructure\Persistence\DbalCustomerAccountAdapter

    App\Identity\Application\Port\CustomerRegistrar:
        alias: App\Identity\Infrastructure\Persistence\DbalCustomerAccountAdapter

    App\Identity\Application\Port\CustomerProfileStore:
        alias: App\Identity\Infrastructure\Persistence\DbalCustomerAccountAdapter

    App\Identity\Application\Port\CustomerAddressStore:
        alias: App\Identity\Infrastructure\Persistence\DbalCustomerAddressStore

    App\Identity\Application\Port\GoogleAccountLinker:
        alias: App\Identity\Infrastructure\Persistence\DbalGoogleAccountLinker

    App\Identity\Application\Port\PasswordResetStore:
        alias: App\Identity\Infrastructure\Persistence\DbalPasswordResetStore

    App\Identity\Application\Port\PasswordResetTokenStore:
        alias: App\Identity\Infrastructure\Persistence\DbalPasswordResetStore

    App\Identity\Application\Port\ContactMessageStore:
        alias: App\Identity\Infrastructure\Persistence\DbalIdentityIntakeStore

    App\Identity\Application\Port\NewsletterStore:
        alias: App\Identity\Infrastructure\Persistence\DbalIdentityIntakeStore

    App\Identity\Application\Port\QuoteRequestStore:
        alias: App\Identity\Infrastructure\Persistence\DbalQuoteRequestStore

    App\Identity\Application\Port\WishlistStore:
        alias: App\Identity\Infrastructure\Persistence\DbalWishlistStore

    App\Identity\Application\Port\IdentityAuditPort:
        alias: App\Identity\Infrastructure\Persistence\DbalIdentityAuditPort

    # solid Task 3.3 (DIP-003): the Ordering handlers read and transition through narrow ports;
    # the customer read has its own adapter because both ports declare `find`.
    App\Ordering\Application\Port\OrderStateReader:
        alias: App\Ordering\Infrastructure\Persistence\DbalOrderStateAdapter

    App\Ordering\Application\Port\OrderTransitionStore:
        alias: App\Ordering\Infrastructure\Persistence\DbalOrderStateAdapter

    App\Ordering\Application\Port\OrderCustomerReader:
        alias: App\Ordering\Infrastructure\Persistence\DbalOrderCustomerAdapter

    App\Ordering\Application\Port\AdminProxyOrderStore:
        alias: App\Ordering\Infrastructure\Persistence\DbalAdminProxyOrderStore

    # solid Task 3.4 (DIP-003): the payment confirm/refund guards read through the snapshot port.
    App\Payment\Application\Port\PaymentStateReader:
        alias: App\Payment\Infrastructure\Persistence\DbalPaymentStateAdapter

    # solid Task 3.5 (DIP-003): the settings writers own their singleton upserts.
    App\Shared\Application\Port\PlatformSettingsWriter:
        alias: App\Shared\Infrastructure\Persistence\DbalPlatformSettingsWriter

    App\Shared\Application\Port\ShippingPolicyWriter:
        alias: App\Shared\Infrastructure\Persistence\DbalShippingPolicyWriter

    # ADR-0001 — the payment row and its ledger move together, through one guarded write.
    App\Payment\Domain\Model\PaymentLedger:
        alias: App\Payment\Infrastructure\Persistence\DbalPaymentLedger

    # ADR-0005: one client for the storefront search index (read finder + indexer).
    Meilisearch\Client:
        arguments:
            $url: '%env(MEILISEARCH_URL)%'

    # spec-run-9 (R1/R2) — the WhatsApp contact is configuration-only: the number and the default
    # message reach the read handler through #[Autowire('%env(...)%')] on its constructor, so no
    # value is hardcoded in src/** and the wiring lives with the class that needs it.
    App\Shared\Domain\Outbox\OutboxPort:
        alias: App\Shared\Infrastructure\Outbox\DoctrineOutbox

    # spec-run-8 (ADR-0012): catalog audit rows are slugs, not user ids, so they cannot reuse
    # identity_audit_log — the port keeps the handlers free of the table choice.
    App\Catalog\Application\Port\CatalogAuditPort:
        alias: App\Catalog\Infrastructure\Audit\DbalCatalogAuditWriter

    # spec-run-15 WP2 (R2) + solid Task 2.5 (ISP-001): one adapter owns catalog_submission behind
    # narrow per-transition ports. Every alias points at the same instance, written out so a second
    # adapter is a visible decision, not a silent change of the command side.
    App\Catalog\Application\Port\CatalogSubmissionCreator:
        alias: App\Catalog\Infrastructure\Persistence\DbalCatalogSubmissionStore
        public: true

    App\Catalog\Application\Port\CatalogSubmissionSubmitter:
        alias: App\Catalog\Infrastructure\Persistence\DbalCatalogSubmissionStore
        public: true

    App\Catalog\Application\Port\CatalogSubmissionDecider:
        alias: App\Catalog\Infrastructure\Persistence\DbalCatalogSubmissionStore
        public: true

    App\Catalog\Application\Port\CatalogSubmissionReviewer:
        alias: App\Catalog\Infrastructure\Persistence\DbalCatalogSubmissionStore
        public: true

    App\Catalog\Application\Port\CatalogSubmissionOwnerEditor:
        alias: App\Catalog\Infrastructure\Persistence\DbalCatalogSubmissionStore
        public: true

    App\Catalog\Application\Port\CatalogSubmissionDeleter:
        alias: App\Catalog\Infrastructure\Persistence\DbalCatalogSubmissionStore
        public: true

    App\Catalog\Domain\Repository\CatalogSubmissionRepository:
        alias: App\Catalog\Infrastructure\Persistence\DbalCatalogSubmissionStore

    # spec-run-12 (R18): the review write asks the read side through a port, so Application never
    # names the SQL predicate. The container can resolve the interface on its own while there is one
    # implementation; the binding is written out because a second implementation must be a visible
    # decision, not a silent change of what the command side is talking to.
    App\Catalog\Application\Port\ProductVisibilityPort:
        alias: App\Catalog\Infrastructure\ReadModel\DbalProductVisibility

    # ADR-0011: the malformed-cookie guard must read the same cookie name the firewall writes.
    App\Identity\Infrastructure\Security\MalformedRememberMeCookieSubscriber:
        arguments:
            $cookieName: '%remember_me_cookie_name%'

    messenger.bus.command:
        alias: command.bus
        public: true
    messenger.bus.query:
        alias: query.bus
        public: true
    messenger.bus.event:
        alias: event.bus
        public: true
    messenger.bus.command.bus:
        alias: command.bus
        public: true
    messenger.bus.query.bus:
        alias: query.bus
        public: true
    messenger.bus.event.bus:
        alias: event.bus
        public: true

    App\Shared\Infrastructure\Outbox\OutboxRelay:
        arguments:
            $eventBus: '@event.bus'

    App\Shared\Infrastructure\Http\MessengerQuery:
        arguments:
            $queryBus: '@query.bus'

    App\Shared\Application\Port\StorefrontCatalogPort:
        alias: App\Catalog\Infrastructure\Adapter\DbalStorefrontCatalogPort

    App\Shared\Application\Port\StorefrontPricingPort:
        alias: App\Shared\Infrastructure\Adapter\DbalStorefrontPricingPort

    App\Shared\Application\Port\StorefrontCategoryPort:
        alias: App\Shared\Infrastructure\Adapter\DbalStorefrontCategoryPort

    # Health probes are collected by tag; see src/Shared/Infrastructure/Health (WP3, R23-R25).
    App\Shared\Application\Service\ReadinessService:
        arguments:
            $probes: !tagged_iterator app.health_probe

    # spec-run-15 R30/R31 (ADR-0017): every context contributes its replay names through this tag,
    # so Shared never names a context and the command cannot drift from the registered set.
    App\Shared\Infrastructure\Projection\ProjectionRegistry:
        arguments:
            $replayers: !tagged_iterator app.projection_replayer

    App\Shared\Infrastructure\Health\MigrationsHealthProbe:
        arguments:
            $dependencyFactory: '@doctrine.migrations.dependency_factory'
