# DIP-001 / LAY-003 — Domain is not a service layer; HTTP under */Infrastructure/Http (SRP-002).
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Shared\Application\Port\HealthProbe:
            tags: ['app.health_probe']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Domain/**'
            - '../src/**/Application/Command/**'
            - '../src/**/Application/Query/**'
            - '../src/Identity/Infrastructure/Security/CustomerUser.php'

    App\Shared\Infrastructure\:
        resource: '../src/Shared/Infrastructure/'

    App\Catalog\Infrastructure\:
        resource: '../src/Catalog/Infrastructure/'
    App\Cart\Infrastructure\:
        resource: '../src/Cart/Infrastructure/'
    App\Ordering\Infrastructure\:
        resource: '../src/Ordering/Infrastructure/'
    App\Payment\Infrastructure\:
        resource: '../src/Payment/Infrastructure/'
    App\Inventory\Infrastructure\:
        resource: '../src/Inventory/Infrastructure/'
    App\Shipping\Infrastructure\:
        resource: '../src/Shipping/Infrastructure/'
    App\Identity\Infrastructure\:
        resource: '../src/Identity/Infrastructure/'
        exclude:
            - '../src/Identity/Infrastructure/Security/CustomerUser.php'
    App\Promotions\Infrastructure\:
        resource: '../src/Promotions/Infrastructure/'

    App\Shared\Application\:
        resource: '../src/Shared/Application/'
        exclude:
            - '../src/Shared/Application/Command/**'
            - '../src/Shared/Application/Query/**'

    App\Catalog\Application\:
        resource: '../src/Catalog/Application/'
        exclude:
            - '../src/Catalog/Application/Command/**'
            - '../src/Catalog/Application/Query/**'
    App\Cart\Application\:
        resource: '../src/Cart/Application/'
        exclude:
            - '../src/Cart/Application/Command/**'
            - '../src/Cart/Application/Query/**'
    App\Ordering\Application\:
        resource: '../src/Ordering/Application/'
        exclude:
            - '../src/Ordering/Application/Command/**'
            - '../src/Ordering/Application/Query/**'
    App\Payment\Application\:
        resource: '../src/Payment/Application/'
        exclude:
            - '../src/Payment/Application/Command/**'
            - '../src/Payment/Application/Query/**'
    App\Inventory\Application\:
        resource: '../src/Inventory/Application/'
        exclude:
            - '../src/Inventory/Application/Command/**'
            - '../src/Inventory/Application/Query/**'
    App\Shipping\Application\:
        resource: '../src/Shipping/Application/'
        exclude:
            - '../src/Shipping/Application/Command/**'
            - '../src/Shipping/Application/Query/**'
    App\Identity\Application\:
        resource: '../src/Identity/Application/'
        exclude:
            - '../src/Identity/Application/Command/**'
            - '../src/Identity/Application/Query/**'
    App\Promotions\Application\:
        resource: '../src/Promotions/Application/'
        exclude:
            - '../src/Promotions/Application/Command/**'
            - '../src/Promotions/Application/Query/**'

    App\Catalog\Domain\Repository\ProductRepository:
        alias: App\Catalog\Infrastructure\Persistence\DoctrineProductRepository

    App\Cart\Domain\Repository\CartRepository:
        alias: App\Cart\Infrastructure\Persistence\DbalCartRepository

    App\Ordering\Domain\Repository\OrderRepository:
        alias: App\Ordering\Infrastructure\Persistence\DoctrineOrderRepository

    # ADR-0005: one client for the storefront search index (read finder + indexer).
    Meilisearch\Client:
        arguments:
            $url: '%env(MEILISEARCH_URL)%'

    App\Shared\Domain\Outbox\OutboxPort:
        alias: App\Shared\Infrastructure\Outbox\DoctrineOutbox

    messenger.bus.command:
        alias: command.bus
        public: true
    messenger.bus.query:
        alias: query.bus
        public: true
    messenger.bus.event:
        alias: event.bus
        public: true
    messenger.bus.command.bus:
        alias: command.bus
        public: true
    messenger.bus.query.bus:
        alias: query.bus
        public: true
    messenger.bus.event.bus:
        alias: event.bus
        public: true

    App\Shared\Infrastructure\Outbox\OutboxRelay:
        arguments:
            $eventBus: '@event.bus'

    App\Ordering\Application\Saga\CheckoutSaga:
        arguments:
            $commandBus: '@command.bus'

    App\Shared\Infrastructure\Http\MessengerQuery:
        arguments:
            $queryBus: '@query.bus'

    App\Shared\Application\Port\StorefrontCatalogPort:
        alias: App\Catalog\Infrastructure\Adapter\DbalStorefrontCatalogPort

    App\Shared\Application\Port\StorefrontPricingPort:
        alias: App\Shared\Infrastructure\Adapter\DbalStorefrontPricingPort

    App\Shared\Application\Port\StorefrontCategoryPort:
        alias: App\Shared\Infrastructure\Adapter\DbalStorefrontCategoryPort

    # Health probes are collected by tag; see src/Shared/Infrastructure/Health (WP3, R23-R25).
    App\Shared\Application\Service\ReadinessService:
        arguments:
            $probes: !tagged_iterator app.health_probe

    App\Shared\Infrastructure\Health\MigrationsHealthProbe:
        arguments:
            $dependencyFactory: '@doctrine.migrations.dependency_factory'
