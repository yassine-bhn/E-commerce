deptrac:
  paths:
    - ../src
  exclude_files:
    - '#.*Kernel\.php#'

  # One layer per (context, tier): the token set is a partition, so no class can sit
  # in two layers and every rule below is about a real dependency, not a double count.
  # LAY-001..LAY-004 are expressed by the ruleset at the bottom.
  layers:
    - name: Cart.Domain
      collectors:
        - type: directory
          value: src/Cart/Domain/.*
    - name: Cart.Application
      collectors:
        - type: directory
          value: src/Cart/Application/.*
    - name: Cart.Infrastructure
      collectors:
        - type: directory
          value: src/Cart/Infrastructure/.*

    - name: Catalog.Domain
      collectors:
        - type: directory
          value: src/Catalog/Domain/.*
    - name: Catalog.Application
      collectors:
        - type: directory
          value: src/Catalog/Application/.*
    - name: Catalog.Infrastructure
      collectors:
        - type: directory
          value: src/Catalog/Infrastructure/.*

    - name: Identity.Domain
      collectors:
        - type: directory
          value: src/Identity/Domain/.*
    - name: Identity.Application
      collectors:
        - type: directory
          value: src/Identity/Application/.*
    - name: Identity.Infrastructure
      collectors:
        - type: directory
          value: src/Identity/Infrastructure/.*

    - name: Inventory.Domain
      collectors:
        - type: directory
          value: src/Inventory/Domain/.*
    - name: Inventory.Application
      collectors:
        - type: directory
          value: src/Inventory/Application/.*
    - name: Inventory.Infrastructure
      collectors:
        - type: directory
          value: src/Inventory/Infrastructure/.*

    - name: Ordering.Domain
      collectors:
        - type: directory
          value: src/Ordering/Domain/.*
    - name: Ordering.Application
      collectors:
        - type: directory
          value: src/Ordering/Application/.*
    - name: Ordering.Infrastructure
      collectors:
        - type: directory
          value: src/Ordering/Infrastructure/.*

    - name: Payment.Domain
      collectors:
        - type: directory
          value: src/Payment/Domain/.*
    - name: Payment.Application
      collectors:
        - type: directory
          value: src/Payment/Application/.*
    - name: Payment.Infrastructure
      collectors:
        - type: directory
          value: src/Payment/Infrastructure/.*

    - name: Promotions.Domain
      collectors:
        - type: directory
          value: src/Promotions/Domain/.*
    - name: Promotions.Application
      collectors:
        - type: directory
          value: src/Promotions/Application/.*
    - name: Promotions.Infrastructure
      collectors:
        - type: directory
          value: src/Promotions/Infrastructure/.*

    - name: Shipping.Domain
      collectors:
        - type: directory
          value: src/Shipping/Domain/.*
    - name: Shipping.Application
      collectors:
        - type: directory
          value: src/Shipping/Application/.*
    - name: Shipping.Infrastructure
      collectors:
        - type: directory
          value: src/Shipping/Infrastructure/.*

    - name: Shared.Domain
      collectors:
        - type: directory
          value: src/Shared/Domain/.*
    - name: Shared.Application
      collectors:
        - type: directory
          value: src/Shared/Application/.*
    - name: Shared.Infrastructure
      collectors:
        - type: directory
          value: src/Shared/Infrastructure/.*

  ruleset:
    # LAY-001 — Domain depends on Shared.Domain only; nothing outward.
    Cart.Domain:
      - Shared.Domain
    Catalog.Domain:
      - Shared.Domain
    Identity.Domain:
      - Shared.Domain
    Inventory.Domain:
      - Shared.Domain
    Ordering.Domain:
      - Shared.Domain
    Payment.Domain:
      - Shared.Domain
    Promotions.Domain:
      - Shared.Domain
    Shipping.Domain:
      - Shared.Domain
    Shared.Domain: []

    # LAY-002 — Application orchestrates its own Domain plus the Shared ports.
    Cart.Application:
      - Cart.Domain
      - Shared.Domain
      - Shared.Application
    Catalog.Application:
      - Catalog.Domain
      - Shared.Domain
      - Shared.Application
    Identity.Application:
      - Identity.Domain
      - Shared.Domain
      - Shared.Application
    Inventory.Application:
      - Inventory.Domain
      - Shared.Domain
      - Shared.Application
    Ordering.Application:
      - Ordering.Domain
      - Shared.Domain
      - Shared.Application
    Payment.Application:
      - Payment.Domain
      - Shared.Domain
      - Shared.Application
    Promotions.Application:
      - Promotions.Domain
      - Shared.Domain
      - Shared.Application
    Shipping.Application:
      - Shipping.Domain
      - Shared.Domain
      - Shared.Application
    Shared.Application:
      - Shared.Domain

    # LAY-003 — Infrastructure implements the inner ports; it may name another
    # context only through its Infrastructure (the explicit ACL).
    Cart.Infrastructure:
      - Cart.Domain
      - Cart.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Catalog.Infrastructure
      - Identity.Infrastructure
      - Inventory.Infrastructure
      - Ordering.Infrastructure
      - Payment.Infrastructure
      - Promotions.Infrastructure
      - Shipping.Infrastructure
    Catalog.Infrastructure:
      - Catalog.Domain
      - Catalog.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Cart.Infrastructure
      - Identity.Infrastructure
      - Inventory.Infrastructure
      - Ordering.Infrastructure
      - Payment.Infrastructure
      - Promotions.Infrastructure
      - Shipping.Infrastructure
    Identity.Infrastructure:
      - Identity.Domain
      - Identity.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Cart.Infrastructure
      - Catalog.Infrastructure
      - Inventory.Infrastructure
      - Ordering.Infrastructure
      - Payment.Infrastructure
      - Promotions.Infrastructure
      - Shipping.Infrastructure
    Inventory.Infrastructure:
      - Inventory.Domain
      - Inventory.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Cart.Infrastructure
      - Catalog.Infrastructure
      - Identity.Infrastructure
      - Ordering.Infrastructure
      - Payment.Infrastructure
      - Promotions.Infrastructure
      - Shipping.Infrastructure
    Ordering.Infrastructure:
      - Ordering.Domain
      - Ordering.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Cart.Infrastructure
      - Catalog.Infrastructure
      - Identity.Infrastructure
      - Inventory.Infrastructure
      - Payment.Infrastructure
      - Promotions.Infrastructure
      - Shipping.Infrastructure
    Payment.Infrastructure:
      - Payment.Domain
      - Payment.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Cart.Infrastructure
      - Catalog.Infrastructure
      - Identity.Infrastructure
      - Inventory.Infrastructure
      - Ordering.Infrastructure
      - Promotions.Infrastructure
      - Shipping.Infrastructure
    Promotions.Infrastructure:
      - Promotions.Domain
      - Promotions.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Cart.Infrastructure
      - Catalog.Infrastructure
      - Identity.Infrastructure
      - Inventory.Infrastructure
      - Ordering.Infrastructure
      - Payment.Infrastructure
      - Shipping.Infrastructure
    Shipping.Infrastructure:
      - Shipping.Domain
      - Shipping.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Cart.Infrastructure
      - Catalog.Infrastructure
      - Identity.Infrastructure
      - Inventory.Infrastructure
      - Ordering.Infrastructure
      - Payment.Infrastructure
      - Promotions.Infrastructure
    Shared.Infrastructure:
      - Shared.Domain
      - Shared.Application
      - Cart.Infrastructure
      - Catalog.Infrastructure
      - Identity.Infrastructure
      - Inventory.Infrastructure
      - Ordering.Infrastructure
      - Payment.Infrastructure
      - Promotions.Infrastructure
      - Shipping.Infrastructure
